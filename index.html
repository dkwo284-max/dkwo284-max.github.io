<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Hub · 나의 앱 모음</title>
<meta name="description" content="Daily Brief, 웨일 레이더 등 나의 앱을 한곳에서">
<meta name="theme-color" content="#f4f5f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Hub">
<style>
:root {
  --bg: #f4f5f7; --surface: #fff; --text: #111827; --muted: #5b6472; --line: #e5e7eb;
  --accent: #1d4ed8; --ok: #059669; --ok-bg: #ecfdf5; --wait: #92400e; --wait-bg: #fef3c7;
  --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 4px 16px rgb(0 0 0 / .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1120; --surface: #131c2e; --text: #e5e7eb; --muted: #94a3b8; --line: #243047;
    --accent: #7aa2ff; --ok: #34d399; --ok-bg: #064e3b; --wait: #fcd34d; --wait-bg: #422006; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1120; --surface: #131c2e; --text: #e5e7eb; --muted: #94a3b8; --line: #243047;
  --accent: #7aa2ff; --ok: #34d399; --ok-bg: #064e3b; --wait: #fcd34d; --wait-bg: #422006; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 720px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; gap: 12px; margin: 8px 0 4px; }
header img { width: 40px; height: 40px; border-radius: 10px; }
h1 { margin: 0; font-size: 1.4rem; }
.today { margin: 0 0 20px; color: var(--muted); font-size: .92rem; }
.apps { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 600px) { .apps { grid-template-columns: 1fr 1fr; } }
.app { display: grid; grid-template-columns: 56px 1fr; gap: 6px 14px; align-items: start; padding: 16px; border-radius: 18px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); color: inherit; text-decoration: none;
  transition: transform .15s ease, border-color .15s ease; min-height: 128px; }
.app:hover { border-color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .app:active { transform: scale(.98); } }
.app img, .app .ph { width: 56px; height: 56px; border-radius: 14px; grid-row: span 3; }
.app .ph { display: grid; place-items: center; background: var(--bg); border: 1px dashed var(--line); font-size: 1.5rem; color: var(--muted); }
.app h2 { margin: 0; font-size: 1.08rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.app p { margin: 0; color: var(--muted); font-size: .88rem; }
.status { font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.status.ok { color: var(--ok); background: var(--ok-bg); }
.status.wait { color: var(--wait); background: var(--wait-bg); }
.meta { font-size: .78rem; color: var(--muted); }
.usage { margin: 0 0 14px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: .86rem; }
.usage b { font-size: 1rem; }
.usage .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
.usage .bar i { display: block; height: 100%; background: var(--accent); }
.usage small { display: block; color: var(--muted); margin-top: 6px; }
.ai { font-size: .78rem; color: var(--muted); }
.app > :not(img):not(.ph) { grid-column: 2; }
.hello { color: var(--muted); font-size: .95rem; padding: 24px 0; }
.apps > h2.group { grid-column: 1 / -1; margin: 14px 0 0; font-size: 1rem; }
.apps > h2.group small { font-weight: 400; font-size: .76rem; color: var(--muted); margin-left: 6px; }
.status.bad { color: #b42318; background: #fde8e7; }
@media (prefers-color-scheme: dark) { .status.bad { color: #ffb4ab; background: #4a1c19; } }
.meta.bad { color: #b42318; }
.alertbar { margin: 0 0 14px; padding: 10px 14px; border-radius: 14px; border: 1px solid #f4b4ae; background: #fde8e7; color: #7a1d14; font-size: .86rem; }
@media (prefers-color-scheme: dark) { .alertbar { background: #3b1714; border-color: #6b2a24; color: #ffd7d2; } }
.alertbar b { display: block; margin-bottom: 2px; }
.alertbar a { color: inherit; }
.board { margin: 0 0 14px; padding: 10px 12px 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.board h2 { margin: 0 0 4px; font-size: .95rem; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.board h2 small { font-weight: 400; font-size: .74rem; color: var(--muted); }
.board a { display: grid; grid-template-columns: 12px 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); color: inherit; text-decoration: none; font-size: .84rem; }
.board a:first-of-type { border-top: 0; }
.board img { width: 22px; height: 22px; border-radius: 6px; }
.board .nm b { display: block; font-size: .86rem; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board .nm small, .board .tm small { display: block; color: var(--muted); font-size: .72rem; line-height: 1.3; }
.board .tm { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.board .tm span { font-size: .8rem; }
.bdot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.bdot.ok { background: var(--ok); } .bdot.wait { background: #f5a524; } .bdot.bad { background: #d92d20; }
.bdot.none { background: transparent; border: 2px solid var(--muted); width: 6px; height: 6px; }
.bdot.unk { background: transparent; border: 2px dashed #f5a524; width: 6px; height: 6px; }
.board .key { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; padding-top: 6px; border-top: 1px solid var(--line); font-size: .72rem; color: var(--muted); }
.board .key span { display: inline-flex; align-items: center; gap: 4px; }
.status.priv { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.app.soon { box-shadow: none; background: transparent; border-style: dashed; cursor: default; }
.today3 { margin: 0 0 16px; padding: 12px 14px; border: 1px solid var(--line, #e5e7eb); border-radius: 14px; }
.today3 h2 { margin: 0 0 6px; font-size: 1rem; }
.today3 a { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line, #e5e7eb); color: inherit; text-decoration: none; }
.today3 a:first-of-type { border-top: 0; }
.today3 img { width: 28px; height: 28px; border-radius: 7px; }
.today3 b { display: block; font-size: .92rem; line-height: 1.35; }
.today3 small { display: block; color: var(--muted); font-size: .76rem; margin-top: 1px; }
footer { margin-top: 28px; color: var(--muted); font-size: .8rem; }
footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header><img src="icon.svg" alt=""><h1>My Hub</h1></header>
  <p class="today" id="today"></p>
  <section class="today3" id="today3" hidden aria-label="오늘 볼 것"></section>
  <main class="apps" id="apps"></main>
  <section class="alertbar" id="alertbar" hidden role="status" style="margin-top:16px"></section>
  <section class="board" id="board" hidden aria-label="앱 갱신 현황" style="margin-top:16px"></section>
  <section class="usage" id="usage" hidden style="margin-top:16px"></section>
  <p class="hello" id="hello" hidden>개인 앱 모음 페이지입니다.</p>
  <footer id="foot" hidden>
    모든 앱은 GitHub Actions 가 정해진 시각에 데이터를 만들고 GitHub Pages 로 배포합니다. 홈 화면에 추가하면 앱처럼 열려요.
  </footer>
</div>
<script>
// 앱 목록: 새 앱은 여기에 한 줄 추가. data 는 마지막 업데이트 시각을 읽어 올 파일(같은 github.io 주소라 바로 읽힘)
const APPS = [
  { id: "daily-brief", name: "Daily Brief", icon: "brief-192.png", href: "/News_Summary/",
    desc: "오클랜드·뉴질랜드·한국 아침 뉴스 요약, 이민 레이더, 동네·치안 지도",
    data: "/News_Summary/data/latest.json", time: (d) => d.generated_at, ready: "07:00", sched: { at: "06:00" },
    // 자동 재시도 시각(UTC, daily.yml 의 cron): 일부 실패면 다음 재시도 시각을 보여 줌
    retries: ["17:25", "17:45", "18:15", "18:25", "18:45", "19:15", "21:10", "01:10"],
    problem: (d) => (d.meta?.degraded ? `요약 일부 실패${d.meta.degraded_reason ? "(" + d.meta.degraded_reason + ")" : ""}` : ""), usage: "/News_Summary/data/ai-usage.json",
    today: { url: "/News_Summary/data/latest.json", text: (d) => {
      const all = Object.entries(d.sections || {}).filter(([k]) => k !== "kr_politics").flatMap(([, s]) => s.items || []).filter((i) => !i.carried_from);
      const sc = (i) => (i.importance || 0) * 10 + ({ high: 18, medium: 6 }[i.impact?.level] || 0);
      const top = all.sort((a, b) => sc(b) - sc(a))[0];
      if (!top) return null;
      const high = all.filter((i) => i.impact?.level === "high").length, al = (d.meta?.alerts || []).length;
      return [top.title_ko, `${d.meta?.degraded ? "⚠️ 오늘 요약 일부 실패 · " : ""}${top.impact?.actions?.[0] ? "👉 " + top.impact.actions[0] + " · " : ""}영향 큰 소식 ${high}건${al ? ` · 이민 알림 ${al}건` : ""}`];
    } } },
  { id: "whale-radar", name: "웨일 레이더", icon: "whale-192.png", href: "/Whale_Radar/",
    desc: "버핏·애크먼 등 거물 투자자의 SEC 공시와 인터뷰·뉴스를 한국어로",
    data: "/Whale_Radar/data/dashboard.json", time: (d) => (d.demo ? null : d.generated_at), ready: "18:00", sched: { at: "03:37", utc: true }, usage: "/Whale_Radar/data/ai-usage.json",
    today: { url: "/Whale_Radar/data/strategy.json", text: (d) => {
      const f = d.bases?.follow, pick = d.recommend?.pick;
      if (!f || !pick) return null;
      const m = f.strategies[pick].metrics, now = f.now, ch = now.changes?.[pick] || {}, pc = (x) => (x == null ? "—" : (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%");
      const top = (now.portfolios[pick] || []).slice(0, 4).map((h) => h.t).join(" · ");
      return [`추천 조합: ${d.labels[pick]} (${top})`, `5년 연 ${pc(m.cagr)} · S&P500 ${pc(m.spy_cagr)} · 다음 재조정 ${now.next.slice(5).replace("-", "/")} 무렵${(ch.in || []).length ? ` · 지난 재조정에서 ${ch.in.length}종목 편입` : ""}`];
    } },
    // 대가들이 새로 편입한 종목 조합의 실제 성적(추적 시작일부터) — 웨일 레이더 '신규 편입' 화면과 같은 값
    today2: { url: "/Whale_Radar/data/strategy.json", text: (d) => {
      const nb = d.newbuys, lv = nb?.live, combo = nb?.now?.combo || [];
      if (!combo.length) return null;
      const pc = (x) => (x == null ? "—" : (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%");
      const q = nb.now.period ? `${nb.now.period.slice(0, 4)}년 ${Math.ceil(+nb.now.period.slice(5, 7) / 3)}분기 공시` : "최근 공시";
      return [`신규 편입 추천 ${combo.length}종목: ${combo.slice(0, 4).join(" · ")}${combo.length > 4 ? " 외" : ""}`,
        lv ? `${q} 기준 · 추적 ${lv.days}일째 ${pc(lv.ret_net ?? lv.ret)} (S&P500 ${pc(lv.spy)})` : `${q} 기준 · 성적 추적 준비 중`];
    } } },
  { id: "robotics-radar", name: "로봇 레이더", icon: "robot-192.png", href: "/Robotics_Radar/",
    desc: "휴머노이드·피지컬 AI 기업의 양산·자금·IPO·부품 기회를 부품사·투자 관점으로",
    data: "/Robotics_Radar/data/dashboard.json", time: (d) => d.generated_at, ready: "09:30", sched: { at: "19:10", utc: true }, usage: "/Robotics_Radar/data/ai-usage.json",
    today: { url: "/Robotics_Radar/data/dashboard.json", text: (d) => {
      const since = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
      const news = (d.news || []).filter((x) => x.date >= since).sort((a, b) => (b.importance || 0) - (a.importance || 0) || (b.n_src || 1) - (a.n_src || 1) || b.date.localeCompare(a.date));
      if (!news.length) return null;
      const key = news.filter((x) => x.importance >= 3).length, nm = Object.fromEntries((d.companies || []).map((c) => [c.id, c.name_ko]));
      const who = (news[0].companies || []).slice(0, 2).map((id) => nm[id]).filter(Boolean).join(", ");
      return [news[0].title_ko || news[0].title, `${who ? who + " · " : ""}최근 7일 소식 ${news.length}건 · 핵심 ${key}건${(d.alerts || []).length ? ` · 경보 ${d.alerts.length}건` : ""}`];
    } } },
];

// 개인 도구: Claude 비공개 페이지(본인 계정으로 로그인해야 열림). 허브는 페이지 내용을 읽을 수 없어서,
// 갱신 작업이 끝날 때 이 저장소의 tools-status.json 에 남기는 기록으로 '오늘 갱신됨/안 됨'을 표시합니다.
// every: "daily"(매일 ready 시각(NZ) 이후 오늘 날짜가 있어야 정상) · "weekly"(7일 이내)
// autoRecord: false = 갱신 작업(Claude 예약 작업)이 이 저장소에 기록을 남길 수 없는 도구. 기록이 오래돼도 '갱신 안 됨'으로 단정하지 않고 '확인 불가'로 표시
//        · "quarterly"(데이터·정책 기준일을 90일마다 다시 점검; updated = 마지막 점검일) · 없음(표시 안 함)
// 새 도구를 만들면 여기에 한 줄 추가. repo 는 소스·수집기가 있는 비공개 저장소(없으면 생략).
const TOOLS = [
  { id: "planner", name: "뉴질랜드 이주 설계실", icon: "planner-192.png", href: "https://claude.ai/artifact/6qnLL7cfUe3gqYtzavKq7o",
    desc: "오클랜드 학군·학교(EQI·NCEA) 분석, 이주 경로 추천, 기간·비용 시뮬레이션, 상담 요약", note: "데이터 갱신 시 수동 · 소스 migration-planner", every: "quarterly" },
  { id: "prv", name: "영구영주권 체류 플래너", icon: "prv-192.png", href: "https://claude.ai/artifact/BxteZdapkWvUsvCL7DueRc",
    desc: "주신청자별 PRV 신청 가능일·체류일수·주택/고용 경로 점검, 정책 Q&A", note: "현행 INZ 기준 · 백업 migration-planner/backup", every: "quarterly" },
  { id: "jobs", name: "오클랜드 채용 레이더", icon: "jobs-192.png", href: "https://claude.ai/artifact/GWkSrPbrmGb6HwGTuSSQhn",
    desc: "오클랜드 채용 공고, 영주권 적격 TOP5, 지원 현황, CV·면접 준비", note: "매일 05:30 갱신 · 소스 Job-Radar", every: "daily", ready: "06:30", autoRecord: false, sched: { at: "05:30" } },
  { id: "travel", name: "오클랜드 여행 레이더", icon: "travel-192.png", href: "https://claude.ai/artifact/DEcPVo14CSW9wa92RdCB75",
    desc: "인천 직항·세계 최저가 항공권, 오클랜드 출항 크루즈, F1 일정", note: "매주 금요일 갱신", every: "weekly", autoRecord: false, sched: { at: "08:46", dow: 5 } },
  { id: "leave", name: "휴직 연차 캘린더", icon: "leave-192.png", href: "https://claude.ai/code/artifact/6dbf428c-b06f-47b9-b2c8-9139fbca5e85",
    desc: "육아휴직 2026–2030: 휴직 종료일, 하기휴가 대상, 연차·롱스테이·경조휴가, 뉴질랜드 연차 계산", note: "직접 입력 · 기기 간 자동 저장", sched: { manual: true } },
  { id: "docs", name: "서류 만료일 트래커", icon: "docs-192.png", href: "https://claude.ai/artifact/G6R6WR4keF2hTTN3ZkfwUR",
    desc: "여권·비자·운전면허·차량 WOF/Rego·보험 만료일과 갱신 시작 권장일, 1년 눈금자", note: "직접 입력 · 90·30·7일 전 카톡 알림(매일 06:25 점검)", sched: { manual: true } },
];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rel = (iso) => {
  const t = new Date(iso);
  if (isNaN(t)) return "";
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 60) return `${Math.max(m, 1)}분 전`;
  if (m < 1440) return `${Math.round(m / 60)}시간 전`;
  return t.toLocaleDateString("ko-KR", { month: "long", day: "numeric" });
};

document.getElementById("today").textContent = new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });

// 개발자 모드: 주소 뒤에 #dev=암호 를 붙여 한 번 열면 이 기기에 기억. 암호는 해시(SHA-256)로만 코드에 있음. 해제: #dev=off
// 주의: 카드를 숨기는 것일 뿐 앱 주소 자체는 공개입니다(주소를 아는 사람은 열 수 있음).
const DEV_HASH = "9e7bb9a1a7d15dcab4952ae3e0556a138eae669bda79a7e1b7249154816b1bd9";
async function sha256(t) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
}
async function devMode() {
  const m = location.hash.match(/^#dev=(.*)$/);
  if (m) {
    history.replaceState(null, "", location.pathname + location.search);
    try {
      if (m[1] === "off") localStorage.removeItem("hub.dev");
      else if (await sha256(decodeURIComponent(m[1])) === DEV_HASH) localStorage.setItem("hub.dev", DEV_HASH);
    } catch { /* 저장 불가 환경 */ }
  }
  try { return localStorage.getItem("hub.dev") === DEV_HASH; } catch { return false; }
}

const root = document.getElementById("apps");
function showApps() {
root.innerHTML = APPS.map((a, i) => `
  <a class="app" href="${esc(a.href)}" id="app-${i}">
    <img src="${esc(a.icon)}" alt="" width="56" height="56">
    <h2>${esc(a.name)} <span class="status wait" data-st>확인 중</span></h2>
    <p>${esc(a.desc)}</p>
    <span class="meta" data-meta></span>
    <span class="ai" data-ai></span>
  </a>`).join("") + `
  <h2 class="group">🔒 개인 도구 <small>Claude 비공개 · 본인 계정으로 열림</small></h2>` + TOOLS.map((t) => `
  <a class="app tool" href="${esc(t.href)}" target="_blank" rel="noopener" id="tool-${esc(t.id)}">
    <img src="${esc(t.icon)}" alt="" width="56" height="56">
    <h2>${esc(t.name)} <span class="status priv">비공개</span>${t.every ? ' <span class="status wait" data-st>확인 중</span>' : ""}</h2>
    <p>${esc(t.desc)}</p>
    <span class="meta" data-meta>${esc(t.note)}</span>
  </a>`).join("") + `
  <div class="app soon" aria-label="다음 앱 자리">
    <span class="ph" aria-hidden="true">＋</span>
    <h2>다음 앱</h2>
    <p>새 앱을 만들면 여기에 추가돼요.</p>
  </div>`;

// AI(Gemini) 사용량: 예산표(budget.json)와 각 앱의 ai-usage.json 을 읽어 오늘(오클랜드 00시 기준) 사용량과 공유 예비분을 보여줌.
// 세 앱이 같은 Gemini 키를 나눠 쓰며, 각 앱은 자기 보장량 + 공유 예비분 안에서만 요청합니다.
const nzToday = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Pacific/Auckland" });  // YYYY-MM-DD
async function getJson(url) { try { const r = await fetch(url, { cache: "no-store" }); return r.ok ? await r.json() : null; } catch { return null; } }
async function loadUsage() {
  const budget = await getJson("/budget.json");
  const day = nzToday();
  const rows = await Promise.all(APPS.map(async (a) => {
    const u = a.usage ? await getJson(a.usage) : null;
    const g = budget?.apps?.[a.id]?.guaranteed ?? u?.cap ?? 0;
    const d = u?.days?.[day];
    return { a, known: !!u, n: d?.requests ?? 0, runs: d?.runs ?? 0, g, by: d?.by || {}, week: Object.entries(u?.days || {}).sort().slice(-7).reduce((s, [, x]) => s + (x.requests || 0), 0) };
  }));
  rows.forEach(({ a, known, n, runs, g }) => {
    const i = APPS.indexOf(a), el = document.querySelector(`#app-${i} [data-ai]`);
    const r = rows.find((x) => x.a === a), KIND = { scheduled: "정기", retry: "복구", manual: "수동", side: "부가" };
    const by = Object.entries(r.by).filter(([, v]) => v > 0).map(([k, v]) => `${KIND[k] || k} ${v}`).join("·");
    if (el && known) el.textContent = `AI 오늘 ${n}/${g}회${n > g ? " (예비분 사용)" : ""}${by ? ` [${by}]` : ""} · 실행 ${runs}번 · 7일 ${r.week}회`;
  });
  const known = rows.filter((r) => r.known);
  if (!known.length) return;
  const total = known.reduce((s, r) => s + r.n, 0);
  const reserveUsed = known.reduce((s, r) => s + Math.max(0, r.n - r.g), 0);
  const cap = budget?.total ?? known.reduce((s, r) => s + r.g, 0);
  const reserve = budget?.reserve ?? 0;
  const box = document.getElementById("usage");
  box.hidden = false;
  box.innerHTML = `오늘 Gemini 사용 <b>${total}회</b> / 하루 예산 ${cap}회${reserve ? ` · 공유 예비분 ${Math.min(reserveUsed, reserve)}/${reserve}회 사용` : ""}
    <div class="bar" aria-hidden="true"><i style="width:${Math.min(100, cap ? total / cap * 100 : 0).toFixed(0)}%"></i></div>
    <small>${known.map((r) => `${esc(r.a.name)} ${r.n}/${r.g}`).join(" · ")} · 세 앱이 같은 Gemini 키를 나눠 써요. 하루는 오클랜드 00시에 새로 시작하고, 앱마다 보장량은 서로 뺏지 못합니다.</small>`;
}
loadUsage();

// 지난 7일 품질 한 줄 (Daily Brief 의 status.json — 요약 실패·자동 복구·기준 미달 기사)
getJson("/News_Summary/data/status.json").then((st) => {
  const w = st && st.week, box = document.getElementById("usage");
  if (!w || !w.days || !box) return;
  const line = document.createElement("small");
  line.style.display = "block";
  line.textContent = `Daily Brief 지난 7일: 요약 실패로 끝난 날 ${w.degraded}/${w.days}일 · 자동 복구 ${w.repaired}일 · 재시도 ${w.retries}회${w.items ? ` · 기준 미달 기사 ${w.bad_items}/${w.items}건` : ""}`;
  const add = () => { if (box.hidden) return setTimeout(add, 300); box.append(line); };
  add();
});

// 오늘 볼 것 3줄: 각 앱이 이미 만들어 둔 데이터에서 결론 한 줄씩 (AI 요청 없음)
(async () => {
  const lines = await Promise.all(APPS.flatMap((a) => [a.today, a.today2].filter(Boolean).map((td) => ({ a, td }))).map(async ({ a, td }) => {
    const d = await getJson(td.url);
    let t = null;
    try { t = d ? td.text(d) : null; } catch { t = null; }
    return t ? `<a href="${esc(a.href)}"><img src="${esc(a.icon)}" alt=""><span><b>${esc(t[0])}</b><small>${esc(a.name)} · ${esc(t[1])}</small></span></a>` : "";
  }));
  const box = document.getElementById("today3");
  if (lines.some(Boolean)) { box.hidden = false; box.innerHTML = `<h2>오늘 볼 것</h2>${lines.join("")}`; }
})();

// 상단 경고: 오늘 갱신이 안 됐거나 일부 실패한 앱·도구를 한 줄씩 모아 보여 줌
// 상단 갱신 현황판: 앱마다 상태 점(초록 갱신됨·노랑 대기/부분·빨강 안 됨·점선 확인 불가·빈 원 수동), 주기, 마지막 갱신, 다음 예정
const boardRows = new Map();
const KO_DOW = "일월화수목금토";
function nzParts(d = new Date()) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Pacific/Auckland", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(d).map((x) => [x.type, x.value]));
  return { dow: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(p.weekday), hm: `${p.hour % 24 < 10 ? "0" : ""}${+p.hour % 24}:${p.minute}` };
}
/** 예약 시각을 오클랜드 "HH:MM" 으로 (utc: true 면 오늘 날짜 기준으로 변환, 서머타임 반영) */
function schedHM(sc) {
  if (!sc.utc) return sc.at;
  const n = new Date(), d = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate(), +sc.at.slice(0, 2), +sc.at.slice(3)));
  return d.toLocaleTimeString("en-GB", { timeZone: "Pacific/Auckland", hour: "2-digit", minute: "2-digit", hour12: false });
}
function cadence(x) {
  const sc = x.sched || {};
  if (sc.manual) return "직접 입력";
  if (x.every === "quarterly") return "90일마다 기준일 점검";
  if (sc.dow != null) return `매주 ${KO_DOW[sc.dow]}요일 ${schedHM(sc)}`;
  return sc.at ? `매일 ${schedHM(sc)}` : "";
}
function nextRun(x, quarterlyFrom) {
  const sc = x.sched || {};
  if (sc.manual) return "";
  if (x.every === "quarterly") return quarterlyFrom ? `점검 ${mdOf(new Date(Date.parse(quarterlyFrom) + 90 * 864e5).toISOString().slice(0, 10))}` : "";
  if (!sc.at) return "";
  const { dow, hm } = nzParts(), at = schedHM(sc);
  if (sc.dow != null) {
    let k = (sc.dow - dow + 7) % 7;
    if (k === 0 && hm >= at) k = 7;
    const d = new Date(Date.now() + k * 864e5).toLocaleDateString("sv-SE", { timeZone: "Pacific/Auckland" });
    return k === 0 ? `오늘 ${at}` : k === 1 ? `내일 ${at}` : `${mdOf(d)}(${KO_DOW[sc.dow]}) ${at}`;
  }
  return `${hm < at ? "오늘" : "내일"} ${at}`;
}
function bset(id, patch) {
  boardRows.set(id, { ...(boardRows.get(id) || {}), ...patch });
  const box = document.getElementById("board");
  if (!box) return;
  const items = [...APPS.map((a, i) => ({ x: a, key: a.id, anchor: `app-${i}` })), ...TOOLS.map((t) => ({ x: t, key: t.id, anchor: `tool-${t.id}` }))];
  box.hidden = false;
  box.innerHTML = `<h2>갱신 현황 <small>오클랜드 ${esc(nzParts().hm)} 기준</small></h2>` + items.map(({ x, key, anchor }) => {
    const r = boardRows.get(key) || { cls: "", text: "확인 중" };
    const nx = nextRun(x, r.checked);
    return `<a href="#${anchor}" title="${esc(r.text)}"><i class="bdot ${esc(r.cls || "")}" aria-hidden="true"></i><img src="${esc(x.icon)}" alt="">
      <span class="nm"><b>${esc(x.name)}</b><small>${esc(cadence(x))}${r.text ? " · " + esc(r.text) : ""}</small></span>
      <span class="tm"><span>${esc(r.last || "—")}</span>${nx ? `<small>다음 ${esc(nx)}</small>` : ""}</span></a>`;
  }).join("") + `<div class="key"><span><i class="bdot ok"></i>갱신됨</span><span><i class="bdot wait"></i>대기·부분</span><span><i class="bdot bad"></i>안 됨</span><span><i class="bdot unk"></i>확인 불가</span><span><i class="bdot none"></i>수동</span></div>`;
}
document.addEventListener("click", (e) => {  // 현황판 줄을 누르면 해당 카드로 부드럽게 이동하고 잠깐 강조
  const a = e.target.closest?.(".board a");
  if (!a) return;
  const card = document.getElementById(a.getAttribute("href").slice(1));
  if (!card) return;
  e.preventDefault();
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  card.animate?.([{ boxShadow: "0 0 0 3px var(--accent)" }, { boxShadow: "none" }], { duration: 1400 });
});
const problems = new Map();
function flag(key, name, text) {
  if (text) problems.set(key, `${name}: ${text}`); else problems.delete(key);
  const box = document.getElementById("alertbar");
  box.hidden = !problems.size;
  box.innerHTML = problems.size ? `<b>⚠️ 확인이 필요한 앱 ${problems.size}개</b>${[...problems.values()].map(esc).join("<br>")}` : "";
}
const nzHM = () => new Date().toLocaleTimeString("en-GB", { timeZone: "Pacific/Auckland", hour: "2-digit", minute: "2-digit", hour12: false });
const nzDateOf = (iso) => new Date(iso).toLocaleDateString("sv-SE", { timeZone: "Pacific/Auckland" });
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const mdOf = (d) => d ? `${+d.slice(5, 7)}/${+d.slice(8, 10)}` : "";
/** 다음 자동 재시도 시각(UTC "HH:MM" 목록 → 오클랜드 시각 "HH:MM"), 오늘 남은 게 없으면 "" */
function nextRetry(list) {
  const now = new Date(), cands = [];
  for (const hm of list || []) for (const add of [0, 1]) {
    const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + add, +hm.slice(0, 2), +hm.slice(3)));
    if (d > now && d - now < 12 * 36e5) cands.push(d);
  }
  cands.sort((a, b) => a - b);
  return cands[0] ? cands[0].toLocaleTimeString("en-GB", { timeZone: "Pacific/Auckland", hour: "2-digit", minute: "2-digit", hour12: false }) : "";
}

// 개인 도구 갱신 상태 (tools-status.json: { "<id>": { "updated": "YYYY-MM-DD"(NZ), "at": "HH:MM", "ok": true/false, "note": "..." } })
(async () => {
  const st = await getJson("/tools-status.json");
  const day = nzToday();
  const nowHM = new Date().toLocaleTimeString("en-GB", { timeZone: "Pacific/Auckland", hour: "2-digit", minute: "2-digit", hour12: false });
  const md = (d) => d ? `${+d.slice(5, 7)}/${+d.slice(8, 10)}` : "";
  const ago = (d) => Math.round((Date.parse(day) - Date.parse(d)) / 864e5);
  for (const t of TOOLS.filter((x) => !x.every)) bset(t.id, { cls: "none", text: "", last: "수동" });
  for (const t of TOOLS.filter((x) => x.every)) {
    const card = document.getElementById(`tool-${t.id}`);
    if (!card) continue;
    const badge = card.querySelector("[data-st]"), meta = card.querySelector("[data-meta]");
    const r = st?.[t.id];
    const set = (cls, text, m, bad) => {
      badge.className = `status ${cls}`; badge.textContent = text; meta.textContent = m; meta.classList.toggle("bad", !!bad);
      const unk = /확인 불가|미확인/.test(text);
      bset(t.id, { cls: unk ? "unk" : cls, text, last: r?.updated ? (r.updated === day ? `오늘 ${r.at || ""}`.trim() : `${md(r.updated)}${r.at ? " " + r.at : ""}`) : "—",
        checked: t.every === "quarterly" ? r?.updated : undefined });
    };
    if (!r?.updated) { set("wait", "상태 미확인", `${t.note} · 갱신 기록 없음`); continue; }
    if (t.every === "quarterly") {
      const age = ago(r.updated), due = new Date(Date.parse(r.updated) + 90 * 864e5).toISOString().slice(0, 10);
      if (age <= 90) set("ok", "기준일 최신", `기준일 점검 ${md(r.updated)} · 다음 점검 ${md(due)}${r.note ? " · " + r.note : ""}`);
      else { set("bad", "기준일 점검 필요", `마지막 점검 ${md(r.updated)} (${age}일 전) · 학교 데이터·INZ 정책이 바뀌었는지 확인`, true); flag(t.id, t.name, `기준일 점검 필요 (마지막 ${md(r.updated)})`); }
      continue;
    }
    const last = `마지막 갱신 ${md(r.updated)}${r.at ? " " + r.at : ""}`;
    const unknown = () => set("wait", "갱신 확인 불가", `${t.note} · 마지막 기록 ${md(r.updated)} · 예약 작업이 허브에 기록을 남길 수 없어 실제 갱신 여부는 페이지에서 확인`);
    const extra = r.note ? ` · ${r.note}` : "";
    if (t.every === "daily") {
      if (r.updated === day) set(r.ok === false ? "wait" : "ok", r.ok === false ? "오늘 부분 갱신" : "오늘 갱신됨", `${last}${extra}`, r.ok === false);
      else if (ago(r.updated) === 1 && nowHM < (t.ready || "07:00")) set("wait", "갱신 대기", `오늘 ${t.ready || "07:00"} 전 갱신 예정 · ${last}`);
      else if (t.autoRecord === false) unknown();
      else { set("bad", "오늘 갱신 안 됨", `${last}${extra}`, true); flag(t.id, t.name, `오늘 갱신 안 됨 (마지막 ${md(r.updated)})`); }
    } else {
      if (ago(r.updated) <= 7) set(r.ok === false ? "wait" : "ok", r.ok === false ? "부분 갱신" : "최신", `${last}${extra}`, r.ok === false);
      else if (t.autoRecord === false) unknown();
      else { set("bad", "갱신 안 됨", `${last} (${ago(r.updated)}일 전)`, true); flag(t.id, t.name, `${ago(r.updated)}일째 갱신 안 됨`); }
    }
  }
})();

APPS.forEach(async (a, i) => {
  const card = document.getElementById(`app-${i}`);
  const st = card.querySelector("[data-st]"), meta = card.querySelector("[data-meta]");
  try {
    const r = await fetch(a.data, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const t = a.time(d);
    if (!t) throw new Error("no data");
    const day = nzToday(), upd = nzDateOf(t), prob = a.problem ? a.problem(d) : "";
    const hmOf = new Date(t).toLocaleTimeString("en-GB", { timeZone: "Pacific/Auckland", hour: "2-digit", minute: "2-digit", hour12: false });
    const lastTxt = upd === day ? `오늘 ${hmOf}` : `${mdOf(upd)} ${hmOf}`;
    meta.classList.remove("bad");
    if (upd !== day && !(daysBetween(upd, day) === 1 && nzHM() < (a.ready || "07:00"))) {
      st.textContent = "오늘 갱신 안 됨"; st.className = "status bad"; meta.classList.add("bad");
      meta.textContent = `마지막 업데이트 ${mdOf(upd)} · ${rel(t)}`;
      flag(a.id, a.name, `오늘 갱신 안 됨 (마지막 ${mdOf(upd)})`);
      bset(a.id, { cls: "bad", text: "오늘 갱신 안 됨", last: lastTxt });
    } else if (prob) {
      const nx = nextRetry(a.retries);
      st.textContent = "일부 실패 · 복구 중"; st.className = "status wait"; meta.classList.add("bad");
      meta.textContent = `${prob} · ${nx ? `다음 자동 재시도 ${nx}` : "오늘 자동 재시도 끝남"} · 업데이트 ${rel(t)}`;
      flag(a.id, a.name, `${prob} — ${nx ? `${nx} 자동 재시도` : "자동 재시도 끝남, 수동 확인 필요"}`);
      bset(a.id, { cls: "wait", text: "일부 실패", last: lastTxt });
    } else {
      st.textContent = upd === day ? "오늘 갱신됨" : "갱신 대기"; st.className = `status ${upd === day ? "ok" : "wait"}`;
      bset(a.id, { cls: upd === day ? "ok" : "wait", text: upd === day ? "" : "갱신 대기", last: lastTxt });
      meta.textContent = upd === day ? `업데이트 ${rel(t)}` : `오늘 ${a.ready} 전 갱신 예정 · 업데이트 ${rel(t)}`;
    }
  } catch {
    st.textContent = "준비 중"; st.className = "status wait";
    bset(a.id, { cls: "unk", text: "데이터 없음", last: "—" });
    meta.textContent = "아직 데이터가 없어요";
  }
});
}

devMode().then((dev) => {
  if (dev) { showApps(); document.getElementById("foot").hidden = false; }
  else document.getElementById("hello").hidden = false;
});
</script>
